name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

      - name: Release build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          mkdir dist && cp target/release/quick_dicom dist/
      - name: Release build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release
          mkdir dist && cp target/release/quick_dicom.exe dist/
      - name: Release build (macOS, universal)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir dist
          lipo -create -output dist/quick_dicom \
            target/aarch64-apple-darwin/release/quick_dicom \
            target/x86_64-apple-darwin/release/quick_dicom

      - uses: actions/upload-artifact@v4
        with:
          name: quick_dicom-${{ matrix.name }}
          path: dist/
