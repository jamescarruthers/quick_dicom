[package]
name = "quick_dicom"
version = "0.1.0"
edition = "2024"
description = "A small, fast, GPU-accelerated DICOM viewer"

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
crossbeam-channel = "0.5.17"
dicom-core = "0.10.0"
dicom-dictionary-std = "0.10.0"
dicom-object = "0.10.0"
# Default features give JPEG baseline/lossless, RLE and deflate. `openjpeg-sys` adds
# JPEG 2000 through OpenJPEG, built from bundled C sources by the `cc` crate.
dicom-pixeldata = { version = "0.10.0", features = ["openjpeg-sys"] }
eframe = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
rayon = "1.12.0"
rfd = "0.17.2"
walkdir = "2.5.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Decoding is slow in unoptimised builds, so optimise dependencies even in dev.
[profile.dev.package."*"]
opt-level = 2
